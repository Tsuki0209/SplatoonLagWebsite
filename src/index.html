<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ラグ解説サイト</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- ========================================
         ヘッダー
    ========================================= -->
    <header class="site-header">

        <div class="header-card">

            <h1>ラグ解説サイト</h1>

            <p>
                ゲームのラグ・通信環境について詳しく解説するサイト
            </p>

        </div>


        <!-- ハンバーガーメニュー -->

        <button
            class="menu-button"
            type="button"
            aria-label="メニュー"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </header>



    <!-- ========================================
         メインコンテンツ
    ========================================= -->

    <main>


        <!-- ====================================
             ラグとは？カード
        ===================================== -->

        <section class="article-card">

            <!-- クリップ -->
            <div class="paper-clip"></div>


            <h2>ラグとは？</h2>


            <p>
                オンラインゲームで発生するラグについて、
                原因や仕組み、改善方法などを分かりやすく解説します。
            </p>

        </section>



        <!-- ====================================
             注意
             中身は空
        ===================================== -->

<!-- ========================================
     注意
======================================== -->

<section class="notice">

    <h3>注意</h3>

</section>


<!-- ========================================
     目次
======================================== -->

<section class="toc">

    <h2>目次</h2>

    <ul>
        <li>
            <a href="#">ラグのタイミング解説</a>
        </li>

        <li>
            <a href="#">ラグの知識</a>
        </li>

        <li>
            <a href="#">テクニック</a>
        </li>

        <li>
            <a href="#">ルート</a>
        </li>
    </ul>

</section>


<!-- ========================================
     検索
======================================== -->

<section class="search-card">


        <!-- ====================================
             検索
        ===================================== -->

        <section class="search-card">

            <h2>検索</h2>


            <form
                class="search-form"
                action="#"
                method="get"
            >

                <div class="search-input-wrapper">

                    <span class="search-icon">⌕</span>

                    <input
                        type="text"
                        name="search"
                        placeholder="サイト内検索"
                        aria-label="サイト内検索"
                    >

                </div>


                <button type="submit">
                    検索
                </button>

            </form>

        </section>




        
    </main>


</body>

</html>
